<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1A1D2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="manifest" href="/manifest.json">
<title>TRAZO · Tu pedido en camino</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;font-family:'Inter',Arial,sans-serif;background:#1A1D2E;color:#fff;}
.topbar{display:flex;align-items:center;gap:10px;padding:14px 16px;background:#1A1D2E;flex-shrink:0;}
.brand-mark{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,0.12);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.brand-mark svg{width:18px;height:18px;}
.topbar-text{flex:1;min-width:0;}
.topbar-product{font-size:14px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar-sub{font-size:11px;color:rgba(255,255,255,0.45);margin-top:1px;}
.chip{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:5px 10px;border-radius:20px;background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.7);flex-shrink:0;}
.chip.live{background:#FF5A36;color:#fff;animation:none;}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor;}
.chip.live .dot{animation:blink 1.2s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0.2;}}
#map{flex:1;min-height:0;background:#1E2235;}
.sheet{background:#fff;color:#15182B;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));flex-shrink:0;max-height:55vh;overflow-y:auto;}
.handle{width:36px;height:4px;border-radius:2px;background:#DBE0E8;margin:0 auto 14px;}
.eta-card{display:flex;align-items:center;gap:14px;background:#15182B;color:#fff;border-radius:14px;padding:14px;margin-bottom:14px;}
.eta-icon{width:44px;height:44px;background:rgba(255,255,255,0.1);border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:22px;}
.eta-big{font-size:24px;font-weight:700;}
.eta-sub{font-size:11.5px;color:rgba(255,255,255,0.6);margin-top:2px;}
.prod-name{font-size:18px;font-weight:700;}
.prod-carrier{font-size:12.5px;color:#6B7180;margin-top:3px;}
.status-row{display:flex;align-items:center;gap:8px;background:#ECF0F5;border-radius:11px;padding:11px 13px;margin-top:12px;}
.sdot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.sdot.active{background:#1F9D6F;animation:sp 1.6s ease-in-out infinite;}
.sdot.waiting{background:#C9871E;}
.sdot.off{background:#6B7180;}
@keyframes sp{0%,100%{box-shadow:0 0 0 3px #DCF1E6;}50%{box-shadow:0 0 0 6px #DCF1E6;}}
.stext b{font-size:13.5px;font-weight:700;display:block;}
.stext small{font-size:11.5px;color:#6B7180;}
.route-mini{background:#ECF0F5;border-radius:11px;padding:12px 14px;margin-top:12px;}
.mr-row{display:flex;align-items:center;gap:10px;font-size:12.5px;}
.mr-row+.mr-row{margin-top:8px;}
.mr-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.mr-dot.or{background:#9AA3B2;}
.mr-dot.cr{background:#FF5A36;}
.mr-dot.dt{background:#15182B;}
.mr-lbl{font-size:10.5px;color:#6B7180;width:72px;flex-shrink:0;font-weight:600;}
.mr-val{flex:1;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.btn-courier{width:100%;margin-top:14px;border:none;border-radius:13px;padding:15px;font-size:15px;font-weight:700;background:#15182B;color:#fff;display:flex;align-items:center;justify-content:center;gap:9px;cursor:pointer;}
.btn-courier.sharing{background:#1F9D6F;}
.invalid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px;color:rgba(255,255,255,0.6);}
.invalid b{font-size:18px;color:#fff;display:block;margin-bottom:8px;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:#15182B;color:#fff;font-size:13px;font-weight:600;padding:10px 18px;border-radius:30px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:500;}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
#root{display:flex;flex-direction:column;height:100vh;height:100dvh;}
#sheet{display:none;}
#invalidScreen{display:none;}
@media(prefers-reduced-motion:reduce){*{animation:none!important;}}
</style>
</head>
<body>
<div id="root">
  <div class="topbar">
    <div class="brand-mark">
      <svg viewBox="0 0 36 36" fill="none"><rect x="4" y="9" width="28" height="6" rx="3" fill="#FF5A36"/><rect x="15" y="15" width="6" height="17" rx="3" fill="#ffffff"/><circle cx="28" cy="28" r="4" fill="#FF5A36"/></svg>
    </div>
    <div class="topbar-text">
      <div class="topbar-product" id="topProduct">TRAZO · Tu pedido en camino</div>
      <div class="topbar-sub" id="topSub">Cargando...</div>
    </div>
    <div class="chip" id="chip"><span class="dot"></span><span id="chipTxt">Cargando</span></div>
  </div>

  <div id="map" style="position:relative;">
  <iframe id="mapFrame" 
    style="width:100%;height:100%;border:none;display:block;"
    loading="lazy"
    referrerpolicy="no-referrer-when-downgrade"
    src="about:blank">
  </iframe>
  <div id="mapMsg" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,0.3);font-size:13px;pointer-events:none;">Cargando mapa...</div>
</div>

  <div class="sheet" id="sheet">
    <div class="handle"></div>
    <div class="eta-card">
      <div class="eta-icon">🛵</div>
      <div>
        <div class="eta-big" id="etaBig">—</div>
        <div class="eta-sub" id="etaSub"></div>
      </div>
    </div>
    <div class="prod-name" id="prodName">—</div>
    <div class="prod-carrier" id="prodCarrier"></div>
    <div class="status-row">
      <div class="sdot off" id="sdot"></div>
      <div class="stext"><b id="stextMain">Cargando...</b><small id="stextSub"></small></div>
    </div>
    <div class="route-mini">
      <div class="mr-row"><div class="mr-dot or"></div><span class="mr-lbl">Origen</span><span class="mr-val" id="mrOr">—</span></div>
      <div class="mr-row"><div class="mr-dot cr"></div><span class="mr-lbl">Repartidor</span><span class="mr-val" id="mrCr" style="font-family:monospace;font-size:11px;">Sin señal</span></div>
      <div class="mr-row"><div class="mr-dot dt"></div><span class="mr-lbl">Destino</span><span class="mr-val" id="mrDt">—</span></div>
    </div>
    <button class="btn-courier" id="courierBtn">📍 Soy el repartidor — Activar GPS</button>
  </div>

  <div class="invalid" id="invalidScreen">
    <div style="font-size:48px;margin-bottom:12px;">📦</div>
    <b>Enlace no encontrado</b>
    <span>Este enlace no existe o el pedido ya fue entregado.<br>Pedile al local que te reenvíe el link.</span>
  </div>
</div>

<div class="toast" id="toast"></div>


<script>
'use strict';

var code = new URLSearchParams(location.search).get('code');
var shipment = null;
var liveMap = null;
var markers = {};
var routeLines = [];
var pollTimer = null;
var mapReady = false;
var courierSharing = false;
var watchId = null;
var lastSend = 0;
var toastTimer;

// ── Sonido de notificación ───────────────────────────────────────────────────
var lastStep = -1;
var audioCtx = null;

function playNotification(type) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    var freqs = type === 'delivered' ? [523, 659, 784, 1047] // Do Mi Sol Do - entregado
              : type === 'moving'    ? [440, 554, 659]        // La Do# Mi - en camino
              : [440, 440];                                    // beep simple
    
    var time = audioCtx.currentTime;
    freqs.forEach(function(freq, i) {
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, time + i * 0.18);
      gain.gain.setValueAtTime(0.4, time + i * 0.18);
      gain.gain.exponentialRampToValueAtTime(0.001, time + i * 0.18 + 0.3);
      osc.start(time + i * 0.18);
      osc.stop(time + i * 0.18 + 0.35);
    });
  } catch(e) {
    console.log('Audio not available:', e.message);
  }
}

function checkStepChange(s) {
  if (lastStep === -1) { lastStep = s.currentStep; return; }
  if (s.currentStep !== lastStep) {
    lastStep = s.currentStep;
    var type = s.currentStep === 2 ? 'delivered'
             : s.currentStep === 1 ? 'moving' : 'update';
    playNotification(type);
    // Try browser notification too
    if ('Notification' in window && Notification.permission === 'granted') {
      var msgs = ['🍔 Tu pedido está en preparación', '🛵 Tu pedido está en camino', '✅ ¡Tu pedido fue entregado!'];
      try { new Notification('TRAZO', { body: msgs[s.currentStep] || 'Estado actualizado', icon: '/icons/icon-192.png' }); } catch(e) {}
    }
  }
}

function requestNotifPermission() {
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
  }
}

function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('on'); }, 2400);
}

function showInvalid() {
  document.getElementById('map').style.display = 'none';
  document.getElementById('sheet').style.display = 'none';
  document.getElementById('invalidScreen').style.display = 'flex';
}

if (!code) { showInvalid(); }

// ── Map via Google Maps Embed ─────────────────────────────────────────────────
var lastMapUrl = '';

function buildMapUrl(s) {
  // Use uMap/OpenStreetMap embed - no API key needed
  var mlat, mlon, zoom = 13;
  
  // Center on courier if available, otherwise origin
  if (s.courierLat && s.courierLng) {
    mlat = s.courierLat; mlon = s.courierLng;
  } else if (s.originLat && s.originLng) {
    mlat = s.originLat; mlon = s.originLng;
  } else {
    return null;
  }
  
  // Build markers string for OSM
  var markers = '';
  if (s.originLat) markers += '&marker=' + s.originLat + '%2C' + s.originLng;
  if (s.courierLat) markers += '&marker=' + s.courierLat + '%2C' + s.courierLng;
  if (s.destLat) markers += '&marker=' + s.destLat + '%2C' + s.destLng;
  
  return 'https://www.openstreetmap.org/export/embed.html?bbox=' +
    (mlon-0.05) + '%2C' + (mlat-0.05) + '%2C' + (mlon+0.05) + '%2C' + (mlat+0.05) +
    '&layer=mapnik' + markers;
}

function initMap(s) {
  var url = buildMapUrl(s);
  if (!url) {
    document.getElementById('mapMsg').textContent = 'Sin coordenadas para mostrar el mapa';
    return;
  }
  var frame = document.getElementById('mapFrame');
  frame.src = url;
  lastMapUrl = url;
  mapReady = true;
  frame.onload = function() {
    document.getElementById('mapMsg').style.display = 'none';
  };
  frame.onerror = function() {
    document.getElementById('mapMsg').textContent = 'Mapa no disponible';
  };
}

function placeCourier(lat, lng, instant) {
  document.getElementById('mrCr').textContent = lat.toFixed(5) + ', ' + lng.toFixed(5);
  // Update map with new courier position
  if (shipment) {
    var newUrl = buildMapUrl(shipment);
    if (newUrl && newUrl !== lastMapUrl) {
      document.getElementById('mapFrame').src = newUrl;
      lastMapUrl = newUrl;
    }
  }
}

function fitAll(s) {
  // Handled by Google Maps embed
}

// ── ETA ──────────────────────────────────────────────────────────────────────
function haversine(a, b) {
  var R=6371000, r=function(d){return d*Math.PI/180;};
  var dL=r(b.lat-a.lat), dG=r(b.lng-a.lng);
  var s=Math.sin(dL/2)*Math.sin(dL/2)+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dG/2)*Math.sin(dG/2);
  return 2*R*Math.asin(Math.sqrt(s));
}

function updateETA(s) {
  if (!s.destLat) return;
  var from = (s.courierLat && s.courierLng) ? {lat:s.courierLat, lng:s.courierLng}
           : (s.originLat ? {lat:s.originLat, lng:s.originLng} : null);
  if (!from) return;
  var meters = haversine(from, {lat:s.destLat, lng:s.destLng});
  var mins = Math.max(1, Math.round((meters/1000/30)*60));
  var arr = new Date(Date.now() + mins*60000);
  var hh = String(arr.getHours()).padStart(2,'0'), mm = String(arr.getMinutes()).padStart(2,'0');
  document.getElementById('etaBig').textContent = mins < 60 ? ('~'+mins+' min') : ('~'+Math.floor(mins/60)+'h '+mins%60+'min');
  document.getElementById('etaSub').textContent = 'Llegada estimada: '+hh+':'+mm+' hs · '+(meters/1000).toFixed(1)+' km';
}

// ── UI ───────────────────────────────────────────────────────────────────────
var STEPS = ['🍔 En preparación','🛵 En camino','✅ Entregado'];

function updateUI(s) {
  document.getElementById('topProduct').textContent = s.product;
  document.getElementById('prodName').textContent = s.product;
  document.getElementById('prodCarrier').textContent = 'Transportista: ' + s.carrier + ' · ' + s.tracking;
  document.getElementById('mrOr').textContent = s.originName || '—';
  document.getElementById('mrDt').textContent = s.destName || '—';
  document.getElementById('sheet').style.display = 'block';
  document.getElementById('invalidScreen').style.display = 'none';

  var sdot = document.getElementById('sdot');
  var main = document.getElementById('stextMain');
  var sub  = document.getElementById('stextSub');
  var chip = document.getElementById('chip');
  var chipTxt = document.getElementById('chipTxt');
  var topSub = document.getElementById('topSub');

  sdot.className = 'sdot';
  chip.className = 'chip';

  if (s.currentStep === 3) {
    sdot.classList.add('active');
    main.textContent = '✅ Pedido entregado';
    sub.textContent = '';
    chipTxt.textContent = 'Entregado';
    chip.style.background = '#1F9D6F';
    chip.style.color = '#fff';
    topSub.textContent = 'Entregado';
  } else if (s.courierActive && s.courierLat) {
    sdot.classList.add('active');
    main.textContent = '🛵 Repartidor en camino';
    sub.textContent = 'GPS activo · última posición: ahora';
    chipTxt.textContent = 'GPS en vivo';
    chip.classList.add('live');
    topSub.textContent = s.carrier + ' · ' + s.tracking;
  } else if (s.courierLat) {
    sdot.classList.add('waiting');
    main.textContent = 'Repartidor pausó el GPS';
    sub.textContent = 'La última posición conocida se muestra en el mapa';
    chipTxt.textContent = 'GPS pausado';
    topSub.textContent = s.carrier + ' · ' + s.tracking;
  } else {
    sdot.classList.add('off');
    main.textContent = STEPS[s.currentStep] || 'En proceso';
    sub.textContent = 'Esperando al repartidor...';
    chipTxt.textContent = 'Sin GPS';
    topSub.textContent = s.carrier + ' · ' + s.tracking;
  }

  updateETA(s);
  checkStepChange(s);
}

// ── Polling ───────────────────────────────────────────────────────────────────
function fetchState() {
  fetch('/api/track/' + encodeURIComponent(code))
    .then(function(r) {
      if (!r.ok) { showInvalid(); return null; }
      return r.json();
    })
    .then(function(s) {
      if (!s) return;
      var prevLat = shipment ? shipment.courierLat : null;
      shipment = s;
      updateUI(s);
      if (!mapReady) {
        initMap(s);
      } else if (s.courierLat && s.courierLat !== prevLat) {
        placeCourier(s.courierLat, s.courierLng, false);
        updateETA(s);
      }
    })
    .catch(function(e) {
      console.log('Poll error:', e.message);
    });
}

// ── Courier GPS ───────────────────────────────────────────────────────────────
document.getElementById('courierBtn').addEventListener('click', function() {
  if (courierSharing) stopGPS(); else startGPS();
});

function startGPS() {
  if (!('geolocation' in navigator)) { toast('Tu dispositivo no soporta GPS'); return; }
  var btn = document.getElementById('courierBtn');
  btn.textContent = 'Solicitando GPS...';
  watchId = navigator.geolocation.watchPosition(
    function(pos) {
      var lat = pos.coords.latitude, lng = pos.coords.longitude;
      if (liveMap) placeCourier(lat, lng, false);
      var now = Date.now();
      if (now - lastSend < 3000) return;
      lastSend = now;
      fetch('/api/courier-position', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({code:code, lat:lat, lng:lng})
      }).catch(function(){});
      if (!courierSharing) {
        courierSharing = true;
        btn.className = 'btn-courier sharing';
        btn.textContent = '📍 GPS activo — Tocá para detener';
        toast('GPS activado. El cliente ve tu posición en tiempo real.');
      }
    },
    function(err) {
      var msgs = {1:'Permiso denegado. Habilitá el GPS en ajustes.',2:'GPS no disponible.',3:'Tiempo agotado.'};
      toast(msgs[err.code] || 'No se pudo acceder al GPS.');
      var btn = document.getElementById('courierBtn');
      btn.textContent = '📍 Soy el repartidor — Activar GPS';
      courierSharing = false;
    },
    {enableHighAccuracy:true, maximumAge:3000, timeout:12000}
  );
}

function stopGPS() {
  if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
  courierSharing = false;
  fetch('/api/courier-stop', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:code})}).catch(function(){});
  var btn = document.getElementById('courierBtn');
  btn.className = 'btn-courier';
  btn.textContent = '📍 Soy el repartidor — Activar GPS';
  toast('GPS detenido.');
}

window.addEventListener('beforeunload', stopGPS);

// ── Start ─────────────────────────────────────────────────────────────────────
if (code) {
  requestNotifPermission();
  fetchState();
  pollTimer = setInterval(fetchState, 3000);
}
</script>
</body>
</html>
