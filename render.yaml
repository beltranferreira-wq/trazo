services:
  - type: web
    name: trazo-app
    runtime: node
    plan: free
    buildCommand: apt-get install -y fonts-dejavu-core fonts-liberation && npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trazo-db
          property: connectionString

databases:
  - name: trazo-db
    plan: free
    databaseName: trazo
    user: trazo
